name: Update GitHub metrics

on:
  schedule:
    # 03:00 UTC daily (~8:30 AM IST)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CodesOf-Partha
          filename: github-metrics.svg
          committer_branch: github-metrics
          committer_message: "chore: refresh github-metrics.svg [skip ci]"

          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Kolkata

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: "CodesOf-Partha/CodesOf-Partha.github.io, CodesOf-Partha/Python-CodeKata, CodesOf-Partha/CodeKata, CodesOf-Partha/Bowling-Alley-Game, CodesOf-Partha/SmartGrade"
          plugin_languages_analysis_timeout: 90
          plugin_languages_limit: 12
          plugin_languages_threshold: 1%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_recent_categories: "commits, prs"
          plugin_languages_recent_load: 300

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
